# Supabase pauses free projects after 7 days without activity.
# Do not remove (see CLAUDE.md, section 3).
name: Supabase keepalive

on:
  schedule:
    - cron: '0 12 * * 1,4' # Monday and Thursday, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            "$SUPABASE_URL/rest/v1/settings?select=id" \
            -H "apikey: $SUPABASE_ANON_KEY"
